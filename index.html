<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f2a85">
<meta name="description" content="Práctica de libros contables SUNAT: 50 operaciones nuevas cada 4 horas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viernes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Viernes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Viernes — identidad: tinta índigo + lápiz rojo de corrección sobre papel de libro contable */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --paper:#fbfaf6; --ink:#1b1d36; --muted:#5f627c; --line:#e3dfd4; --rule:#dbe3f6;
  --brand:#2f2a85; --brand-2:#4740c9; --brand-ink:#ffffff; --brand-soft:#ebeafb; --accent:#e2553d;
  --ok:#16815a; --ok-bg:#e1f3ea; --bad:#c2392b; --bad-bg:#fbe5e1; --warn:#985f00; --warn-bg:#fbefd2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --shadow:0 1px 2px rgba(27,29,54,.05),0 6px 18px rgba(27,29,54,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --surface:#181a2e; --paper:#15172a; --ink:#e9eaf6; --muted:#a3a6c2; --line:#2b2e48; --rule:#25304e;
  --brand:#5a53e6; --brand-2:#8a84ff; --brand-ink:#ffffff; --brand-soft:#23244a; --accent:#ff7a5f;
  --ok:#4fd39a; --ok-bg:#133428; --bad:#ff8b7b; --bad-bg:#3c1e1b; --warn:#f2c35b; --warn-bg:#3a2f12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --surface:#181a2e; --paper:#15172a; --ink:#e9eaf6; --muted:#a3a6c2; --line:#2b2e48; --rule:#25304e;
  --brand:#5a53e6; --brand-2:#8a84ff; --brand-ink:#ffffff; --brand-soft:#23244a; --accent:#ff7a5f;
  --ok:#4fd39a; --ok-bg:#133428; --bad:#ff8b7b; --bad-bg:#3c1e1b; --warn:#f2c35b; --warn-bg:#3a2f12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:disabled,select:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:transparent;border-color:transparent}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.35rem,3.6vw,1.9rem)} h2{font-size:1.18rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right}
.mini{font-size:.82rem;color:var(--muted);margin:6px 0}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.b{font-weight:700}
.warnc{color:var(--bad);font-weight:600}
.link{background:none;border:0;color:var(--brand-2);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* Estructura: barra lateral en PC, barra inferior en celular */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#nav{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:800;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.72rem}
.nv{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left}
.nv:hover{background:var(--brand-soft);color:var(--ink)}
.nv.on{background:var(--brand);color:var(--brand-ink)}
main{min-width:0}
#view{max-width:1120px;margin:0 auto;padding:24px 24px 120px;display:grid;gap:16px}
.mode{background:var(--warn-bg);color:var(--warn);font-size:.85rem;padding:8px 16px;text-align:center;margin:0}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 2px}
.hero.sm{align-items:center}
.hx{display:grid;gap:8px;justify-items:end}
.hx select{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.streak{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.streak b{font-family:var(--display);font-size:1.8rem;color:var(--accent);line-height:1}
.streak span{font-size:.82rem;color:var(--muted);max-width:9em;line-height:1.25}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn:hover{background:var(--brand-2)}
.btn.warn{background:var(--accent)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600}
.ghost:hover{border-color:var(--brand-2);color:var(--brand-2)}
.ghost:disabled{opacity:.5;cursor:default}
.sm{padding:6px 11px;font-size:.85rem;border-radius:10px}
.x{border:0;background:var(--brand-soft);color:var(--ink);width:34px;height:34px;border-radius:10px;flex:none}
.x.sm{width:28px;height:28px;padding:0;font-size:.8rem}

/* Nivel */
.lvl-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.steps{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0;margin:16px 0 6px}
.steps li{height:34px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--muted);font-size:.85rem}
.steps li.done{background:var(--brand);color:var(--brand-ink);opacity:.55}
.steps li.now{background:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 3px var(--accent)}
.levels{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.levels li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line)}
.levels li span{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);font-family:var(--mono);font-weight:700;flex:none}
.levels li.done span,.levels li.now span{background:var(--brand);color:var(--brand-ink)}
.levels li.now{border-color:var(--accent)}
.levels small{display:block;color:var(--muted)}

/* Lotes */
.lote{cursor:pointer;display:grid;gap:10px}
.lote:hover{border-color:var(--brand-2)}
.lote.big{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--brand-ink);border:0}
.lote.big .eyebrow,.lote.big .nums span{color:rgba(255,255,255,.75)}
.lote.big .bar{background:rgba(255,255,255,.22)} .lote.big .bar i{background:#fff}
.lote.big .btn{background:#fff;color:var(--brand);justify-self:start}
.lote-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.nums{text-align:right}
.nums b{font-family:var(--mono);font-size:1.25rem;display:block}
.nums span{font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand-2)}
.bar.bad i{background:var(--accent)}
.next{margin:-4px 2px 0;color:var(--muted);font-size:.9rem}
.list{display:grid;gap:10px}
.sec{margin:6px 2px -4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
button.tile:hover{border-color:var(--brand-2)}
.tile b{font-family:var(--display);font-size:1.05rem}
.tile span{color:var(--muted);font-size:.86rem}
.tile.stat b{font-size:1.9rem;color:var(--brand-2)}

/* Práctica */
.lote-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lt{flex:1;min-width:180px}
.timer{font-family:var(--mono);font-weight:700;font-size:1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.blocks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.blk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;display:grid;text-align:center}
.blk b{font-size:.85rem} .blk span{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.blk.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.dr{background:var(--brand-soft)}
.chip.cur{box-shadow:0 0 0 2px var(--brand);border-color:var(--brand)}
.bsum{background:var(--brand-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.bsum.good{background:var(--ok-bg);color:var(--ok)}
.case{display:grid;gap:12px}
.case-h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.badge{background:var(--brand-soft);color:var(--brand-2);font-weight:700;font-size:.75rem;border-radius:8px;padding:3px 8px;letter-spacing:.02em}
.txt{margin:0;font-size:1rem}
.instr{margin:0;font-weight:600;border-left:3px solid var(--accent);padding-left:10px}
.head{margin:-4px 0 0}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.examfoot{display:flex;justify-content:flex-end}

/* Comprobante */
.cp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;font-size:.9rem;max-width:720px}
.cp-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cp-h small{display:block;color:var(--muted)}
.cp-box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;text-align:center;min-width:170px}
.cp-box small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.04em}
.cp-box b{font-family:var(--mono)}
.cp-m{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted)}
.cp-m b{color:var(--ink);font-weight:600}
.cpt{width:100%;border-collapse:collapse;font-size:.86rem}
.cpt th{text-align:left;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 6px}
.cpt td{padding:5px 6px;border-bottom:1px dashed var(--line);vertical-align:top;overflow-wrap:anywhere}
.cp-t{justify-self:end;display:grid;gap:2px;min-width:240px}
.cp-t div{display:flex;justify-content:space-between;gap:16px}
.cp-t .last{border-top:1px solid var(--ink);padding-top:4px;font-weight:700}
.cp-n{margin:0;font-size:.8rem;color:var(--muted)}

/* Libros (tablas): el texto nunca se sale de su celda */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table.book{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.book th{background:var(--brand-soft);color:var(--ink);font-size:.74rem;font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:normal;overflow-wrap:break-word;word-break:normal;hyphens:none;line-height:1.25;min-width:4.6em}
.book th.grp{text-align:center;background:var(--brand);color:var(--brand-ink);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;border-right:1px solid rgba(255,255,255,.25)}
.book td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;white-space:normal;overflow-wrap:break-word;word-break:normal;line-height:1.3}
.book td.tx{min-width:9em}
.book td.t-d{min-width:8.6em}.book td.t-doc{min-width:9.8em}.book td.t-n{min-width:7.4em}.book td.t-k,.book td.t-s,.book td.t-i{min-width:5em}.book td.t-c{min-width:6.5em}.book td.t-sel{min-width:15em}
input::placeholder{color:var(--muted);opacity:.6}input:disabled::placeholder{color:transparent}
.book td.num{white-space:nowrap}
.book tr:last-child td{border-bottom:0}
.book tfoot td{border-top:1.5px solid var(--ink);border-bottom:0}
.book td.in{padding:3px 4px;min-width:6.2em}
.book td.in input,.book td.in select{padding:6px 8px;border-radius:8px;font-size:15px}
.book td.in input.num{text-align:right;font-family:var(--mono)}
.book td.in.ok input,.book td.in.ok select,.book tr.ok td.in input{background:var(--ok-bg);color:var(--ok);-webkit-text-fill-color:var(--ok);border-color:transparent}
.book td.in.bad input,.book td.in.bad select,.book tr.bad td.in input{background:var(--bad-bg);color:var(--bad);-webkit-text-fill-color:var(--bad);border-color:transparent}
.book td.in.mid input{background:var(--warn-bg);color:var(--warn);-webkit-text-fill-color:var(--warn)}
.book .den{color:var(--muted);font-size:.82rem;min-width:10em}
.book.diario{min-width:560px}
.book.compras,.book.ventas{min-width:1320px}
.book.banco{min-width:960px}
.book.kardex{min-width:1320px}
.book.kardexu{min-width:760px}
.book.caja{min-width:640px}
.book.activo{min-width:980px}
.book td.badc{background:var(--bad-bg);color:var(--bad)}
.book tr.badr td{background:var(--bad-bg)}
.book tr.tb td{font-weight:700}
.book tr.dest td{color:var(--muted)}
.book td.solc{color:var(--ok);font-weight:600}
.book tr.click{cursor:pointer}
.book tr.click:hover td{background:var(--brand-soft)}
.book.pdt td.in{min-width:8em}
.swipe{display:none;margin:-4px 0 0}
.glosa{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.85rem;color:var(--muted);padding:2px 2px 0}
.addl{justify-self:start}

/* Corrección */
.fb{border-radius:12px;padding:12px 14px}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.badf{background:var(--bad-bg)}
.fbh{margin:0 0 6px;font-weight:700}
.fb.badf .fbh{color:var(--bad)}
.fb ul{margin:0;padding-left:18px;display:grid;gap:6px}
.fb li{font-size:.9rem}
.why{color:var(--muted)}
.solbox{border:1px dashed var(--ok);border-radius:12px;padding:12px}
.whys{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted);display:grid;gap:3px}

/* Historial */
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:5px;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select{text-transform:none;letter-spacing:0;font-weight:500}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem;margin:10px 0}
.chk input{width:18px;height:18px;flex:none}
.hist{display:grid;gap:6px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.hrow:hover{border-color:var(--brand-2)}
.hm b{display:block;font-weight:600}
.hm small{color:var(--muted);overflow-wrap:anywhere}
.st{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;flex:none}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.bad{background:var(--bad-bg);color:var(--bad)}
.sc{font-family:var(--mono);color:var(--muted)}

/* Mi mes */
.co{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:18px}
.libs{margin:0;padding-left:18px;font-size:.9rem;display:grid;gap:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px;min-width:0}
.kpi span{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--mono);font-size:1.25rem;overflow-wrap:anywhere}
.kpi small{color:var(--muted)}
.kpi.warnk{background:var(--warn-bg)} .kpi.warnk b{color:var(--warn)}
.asi{display:grid;gap:10px}
.asi-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.asi-h b{flex:1;min-width:12em}
.och{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.78rem;color:var(--bad)}
.ochb{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:99px;padding:1px 8px;font-size:.74rem;font-family:var(--mono)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;background:var(--brand-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;color:var(--muted);font-size:.88rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm button{padding:5px 10px;font-size:.8rem}

/* Más */
.srow{display:grid;gap:4px;margin:10px 0}
.sl{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.filebtn{cursor:pointer;display:inline-flex;align-items:center}
#kfab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;width:54px;height:54px;border-radius:16px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22)}
#kfab:hover{filter:brightness(1.06)}
#kcalc{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:16;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;box-shadow:0 18px 50px rgba(10,11,25,.28)}
.kc-h{display:flex;justify-content:space-between;align-items:center;cursor:default}
.kc-d{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;justify-items:end;min-width:0}
.kc-d small{color:var(--muted);font-family:var(--mono);font-size:.78rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc-d output{font-family:var(--mono);font-size:1.6rem;font-weight:700;max-width:100%;overflow-x:auto;white-space:nowrap}
.kc-igv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* Ventanas */

.ob{display:grid;gap:12px;justify-items:start}

.search{font-size:16px}
.plist{display:grid;gap:2px;max-height:52vh;overflow:auto}
.pa{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px}

.loading .logo{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
@media (prefers-reduced-motion:reduce){.loading .logo{animation:none}}

@media (max-width:900px){

function hstr(s) {

  let b = pre; while (b.length < 10) b += R.int(0, 9);

const H4 = 4 * 3600e3, OFF = 5 * 3600e3;
const slotNow = () => Math.floor((Date.now() - OFF) / H4);
const slotLocal = s => new Date(s * H4);
const slotKey = s => { const d = slotLocal(s); return '' + d.getUTCFullYear() + p2(d.getUTCMonth() + 1) + p2(d.getUTCDate()) + p2(d.getUTCHours()); };
const slotISO = s => { const d = slotLocal(s); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`; };
const slotHour = s => p2(slotLocal(s).getUTCHours()) + ':00';
const slotTs = s => s * H4 + OFF;
const limaISO = (ms = Date.now()) => { const d = new Date(ms - OFF); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`; };
const lastDay = M => { const [y, m] = M.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };

/* ===================== Empresa simulada del mes ===================== */
function personName(R) { return R.pick(NOM) + ' ' + R.pick(APE) + ' ' + R.pick(APE); }
function newMonth(M, regime) {
  const R = rngFrom('mes:' + M);
  const giro = R.pick(GIROS);
  const name = R.pick(['Distribuidora', 'Comercializadora', 'Importaciones', 'Negocios', 'Inversiones']) + ' ' + R.pick(W1) + ' ' + R.pick(['S.A.C.', 'E.I.R.L.', 'S.R.L.']);
  const prods = R.shuffle(giro.prods.slice()).slice(0, 4).map(([n, u, lo, hi], i) => ({id: 'P' + (i + 1), n, u, cu: R.amt(lo, hi), cod: 'MER-' + p2(i + 1)}));
  const used = new Set();
  const uniq = gen => { let x; do { x = gen(); } while (used.has(x)); used.add(x); return x; };
  const sups = Array.from({length: 6}, () => ({n: uniq(() => R.pick(W3) + ' ' + R.pick(W2) + ' S.A.C.'), ruc: makeRuc(R)}));
  const clis = Array.from({length: 6}, () => ({n: uniq(() => R.pick(W4) + ' ' + R.pick(W2) + ' ' + R.pick(['S.A.C.', 'E.I.R.L.', 'S.R.L.'])), ruc: makeRuc(R)}));
  const pers = Array.from({length: 6}, () => ({n: uniq(() => personName(R)), dni: String(R.int(10000000, 79999999))}));
  const banco = R.pick(BANCOS);
  const inv = {};
  prods.forEach(p => { const q = R.int(40, 220); inv[p.id] = {q, t: r2(q * p.cu)}; });
  const caja = R.int(15, 40) * 100, bco = R.int(30, 70) * 1000;
  const prevM = (() => { const [y, m] = M.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${p2(m - 1)}`; })();
  const cxc = [0, 1].map(() => { const c = R.pick(clis), base = R.amt(800, 4000), igv = r2(base * 0.18); return {doc: 'F001-' + R.int(20, 90), base, igv, total: r2(base + igv), cli: c, prev: true}; });
  const cxp = [0, 1].map(() => { const s = R.pick(sups), base = R.amt(900, 5000), igv = r2(base * 0.18); return {doc: 'F0' + p2(R.int(1, 40)) + '-' + R.int(100, 9999), total: r2(base + igv), sup: s, prev: true}; });
  const assets = [ACTIVOS[0], ACTIVOS[1]].map(a => ({n: a.n.replace(' para el área administrativa', ''), c: a.c, rate: a.rate, cost: R.int(a.lo / 10, a.hi / 10) * 10, months: R.int(3, 20)}));
  const depAc = r2(assets.reduce((s, a) => s + r2(a.cost * a.rate / 12) * a.months, 0));
  const invT = r2(Object.values(inv).reduce((s, x) => s + x.t, 0));
  const cxcT = r2(cxc.reduce((s, x) => s + x.total, 0)), cxpT = r2(cxp.reduce((s, x) => s + x.total, 0));
  const open = [['101', caja, 0], ['1041', bco, 0], ['1212', cxcT, 0], ['2011', invT, 0]];
  assets.forEach(a => open.push([a.c, a.cost, 0]));
  open.push(['391', 0, depAc], ['4212', 0, cxpT]);
  const dT = open.reduce((s, l) => s + l[1], 0), hT = open.reduce((s, l) => s + l[2], 0);
  open.push(['5011', 0, r2(dT - hT)]);
  return {
    id: M, ts: Date.now(), regime: regime || 'MYPE',
    co: {name, ruc: makeRuc(R), giro: giro.g, prods, sups, clis, pers, banco, cta: '193-' + R.int(1000000, 9999999) + '-0-' + R.int(10, 99), prevM},
    open, c621: null,

    fps: []
  };
}

    default: return null;
  }
  logLines(st, date, op.lines, op.glosa);

}

/* ===================== Plan del lote y generación ===================== */
function planFormats(R, level, n) {
  if (level <= 1) return Array(n).fill('diario');
  const cur = LEVELS[level - 1].f, out = [];
  const w = Object.fromEntries(cur.map(f => [f, FW[f] || 1]));
  const nCur = Math.round(n * 0.6);
  for (let i = 0; i < nCur; i++) out.push(R.wpick(w));
  for (let i = nCur; i < n; i++) { const L = LEVELS[R.int(0, level - 2)]; out.push(R.wpick(Object.fromEntries(L.f.map(f => [f, FW[f] || 1])))); }
  return R.shuffle(out);
}
function makeCase(R, mo, item, date) {
  const [fmt, force] = item.split(':');
  if (OP_FORMATS.includes(fmt)) {
    const types = Object.entries(OPS).filter(([, o]) => o.f.includes(fmt));
    const t = force && OPS[force] && OPS[force].f.includes(fmt) && R.chance(0.75) ? force : R.wpick(Object.fromEntries(types.map(([k, o]) => [k, o.w])));
    const op = genOp(R, mo, t, date, fmt);
    if (!op) return null;

}
/* Genera casos nuevos que nunca repiten una huella ya usada en el mes */
function genCases(seed, mo, plan, date, keepState = true) {
  const R = rngFrom(seed);
  const fps = new Set(mo.fps);
  const saved = keepState ? null : JSON.stringify(mo.state);
  const H = c => fpHash(c.fp + '|' + mo.id + '|' + mo.co.ruc);
  const tryMake = (item, tries) => {
    for (let t = 0; t < tries; t++) {
      const snap = JSON.stringify(mo.state);
      const cand = makeCase(R, mo, item, date);
      if (!cand || fps.has(H(cand))) { mo.state = JSON.parse(snap); continue; }
      return cand;
    }
    return null;
  };
  const cases = [];
  for (const item of plan) {
    // si el formato no es posible ahora (p. ej. sin stock o sin deudas por cobrar), se usa el Libro Diario
    const c = tryMake(item, 60) || tryMake('diario', 60);
    if (!c) continue;
    c.fp = H(c); fps.add(c.fp); mo.fps.push(c.fp); cases.push(c);
  }
  if (saved) mo.state = JSON.parse(saved);
  cases.forEach((c, i) => { c.n = i + 1; });
  return cases;
}

/* ===================== Repaso y examen ===================== */
async function makeExtra(kind) {
  const M = limaISO().slice(0, 7), mo = await getMonth(M);
  let plan;
  if (kind === 'repaso') {
    const fails = allAnswers().filter(x => !x.a.ok).sort((a, b) => b.a.at - a.a.at).slice(0, 40);
    if (!fails.length) { toast('Todavía no tienes errores para repasar. ¡Bien!'); return; }
    const R = rngFrom('rp' + Date.now());
    plan = Array.from({length: 10}, () => { const x = R.pick(fails); return x.s.o && x.s.o !== 'synth' ? x.s.f + ':' + x.s.o : x.s.f; });
  } else {
    const ex = A.idx.find(x => x.kind === 'examen' && x.exam && !x.exam.fin);
    if (ex) return openLote(ex.id);
    const R = rngFrom('ex' + Date.now());
    const fm = LEVELS.slice(0, A.P.level).flatMap(l => l.f);
    plan = Array.from({length: 20}, () => R.pick(fm));
  }
  const ts = Date.now(), id = (kind === 'repaso' ? 'R' : 'X') + ts;
  const cases = genCases(kind + ':' + ts, mo, plan, limaISO(), false);
  const b = {id, kind, ts, month: M, date: limaISO(), hour: new Date(ts - OFF).toISOString().slice(11, 16), level: A.P.level, cases};
  const li = newIndex(b);
  if (kind === 'examen') li.exam = {t0: ts, end: ts + 30 * 60e3, fin: false};
  await Store.set(PATH.b(id), b); await Store.set(PATH.i(id), li); await Store.set(PATH.m(M), mo);
  A.lotes[id] = b; A.idx.unshift(li);
  openLote(id);
}

async function restoreBackup(file) {
  if (!file) return;

    const o = JSON.parse(await file.text());
    if (!o || o.app !== 'viernes' || !o.data) throw new Error('formato');
    const n = Object.keys(o.data).length;
    if (A._restAsk !== file.name + file.size) { A._restAsk = file.name + file.size; toast(`La copia tiene ${n} registros y reemplazará tu progreso actual. Elige el archivo otra vez para confirmar.`, 6000); $('#sImp').value = ''; return; }
    const old = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('viernes:')) old.push(k); }
    old.forEach(k => localStorage.removeItem(k));
    Object.entries(o.data).forEach(([k, v]) => localStorage.setItem(k, v));
    toast('Copia restaurada'); setTimeout(() => location.reload(), 800);
  } catch (e) { toast('Ese archivo no es una copia de Viernes'); }
}

  if (act === 'next') { const n = nextN(); if (n) { A.cur = n; renderLote(); window.scrollTo({top: 0, behavior: 'smooth'}); } return; }
  if (act === 'hint') { A.hint[A.li.id + ':' + A.cur] = true; saveDraft(); return renderCase(); }

  if (act === 'rev621') return rev621();

  if (act === 'pdf') return exportPDF();

function confirmFin() {

  if (!pend) return true;
  if (A._finAsk && Date.now() - A._finAsk < 4000) return true;

}
document.addEventListener('focusin', e => { if (e.target.matches('[data-l=c], [data-k][list]')) A.lastCode = e.target; if (e.target.matches('#view input:not([type=checkbox]):not([type=date]):not([type=file]), #modal input.num')) { A.lastInput = e.target; Kc.upd(); } });

/* ===================== Calculadora flotante (siempre a la mano) ===================== */
const Kc = {
  exp: '', last: null,
  el: () => $('#kcalc'),
  open(v) { this.el().hidden = !v; $('#kfab').setAttribute('aria-expanded', String(v)); if (v) { const x = A.lastInput && document.body.contains(A.lastInput) ? parseNum(A.lastInput.value) : NaN; if (!this.exp && !isNaN(x)) this.exp = String(x); this.upd(); } },
  val() { try { const s = this.exp.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'); if (!s) return 0; if (!/^[\d+\-*/().\s]+$/.test(s)) return NaN; const v = Function('return (' + s.replace(/[+\-*/.]$/, '') + ')')(); return isFinite(v) ? v : NaN; } catch { return NaN; } },
  fmt(v) { if (isNaN(v)) return 'Error'; const r = Math.round(v * 1e8) / 1e8; return r.toLocaleString('en-US', {maximumFractionDigits: 8}); },
  set(v) { this.exp = isNaN(v) ? '' : String(Math.round(v * 1e8) / 1e8); },
  press(k) {
    const ops = '+-*/';
    if (/^\d$/.test(k)) { if (this.last === '=') this.exp = ''; this.exp += k; }
    else if (k === '.') { if (this.last === '=') this.exp = '0'; const seg = this.exp.split(/[+\-*/]/).pop(); if (!seg.includes('.')) this.exp += seg ? '.' : '0.'; }
    else if (ops.includes(k)) { if (!this.exp) this.exp = '0'; if (ops.includes(this.exp.slice(-1))) this.exp = this.exp.slice(0, -1); this.exp += k; }
    else if (k === 'C') this.exp = '';
    else if (k === 'back') this.exp = this.exp.slice(0, -1);
    else if (k === '%') { const m = this.exp.match(/(.*?)([+\-*/]?)([\d.]+)$/); if (m) { const base = m[1] ? Function('return (' + m[1] + ')')() : 0; const n = +m[3]; const pct = (m[2] === '+' || m[2] === '-') ? base * n / 100 : n / 100; this.exp = m[1] + m[2] + (Math.round(pct * 1e8) / 1e8); } }
    else if (k === '=') this.set(this.val());
    else if (k === '+igv') this.set(r2(this.val() * 1.18));
    else if (k === 'igv') this.set(r2(this.val() * 0.18));
    else if (k === '-igv') this.set(r2(this.val() / 1.18));
    else if (k === 'r2') this.set(r2(this.val()));

  },
  put() {

    el.value = String(r2(v)); el.dispatchEvent(new Event('input', {bubbles: true})); el.focus(); toast('Resultado puesto en la celda');
  },
  upd() {
    if (!this.el() || this.el().hidden) return;
    const v = this.val();
    $('#kexp').textContent = this.exp ? this.exp.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−') : ' ';
    $('#kout').textContent = this.exp ? this.fmt(v) : '0';
    const ok = A.lastInput && document.body.contains(A.lastInput) && !A.lastInput.disabled;
    $('#kput').disabled = !ok;
  }
};
if ($('#kfab')) {

$('#kcalc').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });

}
document.addEventListener('keydown', e => {
  if (!Kc.el() || Kc.el().hidden) return;
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
  const map = {Enter: '=', '=': '=', Backspace: 'back', Escape: 'C', Delete: 'C', ',': '.'};
  const k = map[e.key] || (/^[\d.+\-*/%]$/.test(e.key) ? e.key : null);
  if (k) { e.preventDefault(); Kc.press(k); }
});

    const a = $('#sD'), b = $('#sH'); if (a) { a.textContent = nf(sD); b.textContent = nf(sH); }
  }
});

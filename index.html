<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f2a85">
<meta name="description" content="Práctica de libros contables SUNAT: 50 operaciones nuevas cada 4 horas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viernes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Viernes</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Viernes — identidad: tinta índigo + lápiz rojo de corrección sobre papel de libro contable */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --paper:#fbfaf6; --ink:#1b1d36; --muted:#5f627c; --line:#e3dfd4; --rule:#dbe3f6;
  --brand:#2f2a85; --brand-2:#4740c9; --brand-ink:#ffffff; --brand-soft:#ebeafb; --accent:#e2553d;
  --ok:#16815a; --ok-bg:#e1f3ea; --bad:#c2392b; --bad-bg:#fbe5e1; --warn:#985f00; --warn-bg:#fbefd2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --shadow:0 1px 2px rgba(27,29,54,.05),0 6px 18px rgba(27,29,54,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --surface:#181a2e; --paper:#15172a; --ink:#e9eaf6; --muted:#a3a6c2; --line:#2b2e48; --rule:#25304e;
  --brand:#5a53e6; --brand-2:#8a84ff; --brand-ink:#ffffff; --brand-soft:#23244a; --accent:#ff7a5f;
  --ok:#4fd39a; --ok-bg:#133428; --bad:#ff8b7b; --bad-bg:#3c1e1b; --warn:#f2c35b; --warn-bg:#3a2f12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --surface:#181a2e; --paper:#15172a; --ink:#e9eaf6; --muted:#a3a6c2; --line:#2b2e48; --rule:#25304e;
  --brand:#5a53e6; --brand-2:#8a84ff; --brand-ink:#ffffff; --brand-soft:#23244a; --accent:#ff7a5f;
  --ok:#4fd39a; --ok-bg:#133428; --bad:#ff8b7b; --bad-bg:#3c1e1b; --warn:#f2c35b; --warn-bg:#3a2f12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:disabled,select:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:transparent;border-color:transparent}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.35rem,3.6vw,1.9rem)} h2{font-size:1.18rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right}
.mini{font-size:.82rem;color:var(--muted);margin:6px 0}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.b{font-weight:700}
.warnc{color:var(--bad);font-weight:600}
.link{background:none;border:0;color:var(--brand-2);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* Estructura: barra lateral en PC, barra inferior en celular */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#nav{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:800;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.72rem}
.nv{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left}
.nv:hover{background:var(--brand-soft);color:var(--ink)}
.nv.on{background:var(--brand);color:var(--brand-ink)}
main{min-width:0}
#view{max-width:1120px;margin:0 auto;padding:24px 24px 120px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
#view > *{min-width:0}
.mode{background:var(--warn-bg);color:var(--warn);font-size:.85rem;padding:8px 16px;text-align:center;margin:0}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 2px}
.hero.sm{align-items:center}
.hx{display:grid;gap:8px;justify-items:end}
.hx select{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.streak{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.streak b{font-family:var(--display);font-size:1.8rem;color:var(--accent);line-height:1}
.streak span{font-size:.82rem;color:var(--muted);max-width:9em;line-height:1.25}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn:hover{background:var(--brand-2)}
.btn.warn{background:var(--accent)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600}
.ghost:hover{border-color:var(--brand-2);color:var(--brand-2)}
.ghost:disabled{opacity:.5;cursor:default}
.sm{padding:6px 11px;font-size:.85rem;border-radius:10px}
.x{border:0;background:var(--brand-soft);color:var(--ink);width:34px;height:34px;border-radius:10px;flex:none}
.x.sm{width:28px;height:28px;padding:0;font-size:.8rem}

/* Nivel */
.lvl-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.steps{list-style:none;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;padding:0;margin:16px 0 6px}
.steps li{height:34px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--muted);font-size:.85rem}
.steps li.done{background:var(--brand);color:var(--brand-ink);opacity:.55}
.steps li.now{background:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 3px var(--accent)}
.levels{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
.levels li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line)}
.levels li span{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);font-family:var(--mono);font-weight:700;flex:none}
.levels li.done span,.levels li.now span{background:var(--brand);color:var(--brand-ink)}
.levels li.now{border-color:var(--accent)}
.levels small{display:block;color:var(--muted)}

/* Lotes */
.lote{cursor:pointer;display:grid;gap:10px}
.lote:hover{border-color:var(--brand-2)}
.lote.big{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--brand-ink);border:0}
.lote.big .eyebrow,.lote.big .nums span{color:rgba(255,255,255,.75)}
.lote.big .bar{background:rgba(255,255,255,.22)} .lote.big .bar i{background:#fff}
.lote.big .btn{background:#fff;color:var(--brand);justify-self:start}
.lote-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lote-h>div:first-child{min-width:0;flex:1 1 180px}
.nums .link{display:block;margin-left:auto;margin-top:4px;font-size:.82rem}
.nums{text-align:right}
.nums b{font-family:var(--mono);font-size:1.25rem;display:block}
.nums span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.nums{flex:none}
.bar{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand-2)}
.bar.bad i{background:var(--accent)}
.next{margin:-4px 2px 0;color:var(--muted);font-size:.9rem}
.list{display:grid;gap:10px}
.sec{margin:6px 2px -4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
button.tile:hover{border-color:var(--brand-2)}
.tile b{font-family:var(--display);font-size:1.05rem}
.tile span{color:var(--muted);font-size:.86rem}
.tile.stat b{font-size:1.9rem;color:var(--brand-2)}

/* Práctica */
.lote-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lt{flex:1;min-width:180px}
.timer{font-family:var(--mono);font-weight:700;font-size:1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.blocks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.blk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;display:grid;text-align:center}
.blk b{font-size:.85rem} .blk span{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.blk.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.dr{background:var(--brand-soft)}
.chip.cur{box-shadow:0 0 0 2px var(--brand);border-color:var(--brand)}
.bsum{background:var(--brand-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.bsum.good{background:var(--ok-bg);color:var(--ok)}
.case{display:grid;gap:12px}
.case-h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.badge{background:var(--brand-soft);color:var(--brand-2);font-weight:700;font-size:.75rem;border-radius:8px;padding:3px 8px;letter-spacing:.02em}
.txt{margin:0;font-size:1rem}
.instr{margin:0;font-weight:600;border-left:3px solid var(--accent);padding-left:10px}
.head{margin:-4px 0 0}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.examfoot{display:flex;justify-content:flex-end}

/* Comprobante */
.cp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;font-size:.9rem;max-width:720px}
.cp-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cp-h small{display:block;color:var(--muted)}
.cp-box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;text-align:center;min-width:170px}
.cp-box small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.04em}
.cp-box b{font-family:var(--mono)}
.cp-m{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted)}
.cp-m b{color:var(--ink);font-weight:600}
.cpt{width:100%;border-collapse:collapse;font-size:.86rem}
.cpt th{text-align:left;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--line);padding:4px 6px}
.cpt td{padding:5px 6px;border-bottom:1px dashed var(--line);vertical-align:top;overflow-wrap:break-word}
.cpt td.num,.cpt th{white-space:nowrap}
.cpt th:nth-child(1),.cpt th:nth-child(3),.cpt th:nth-child(4){text-align:right}
.cpt td.num{text-align:right}
.cp-t{justify-self:end;display:grid;gap:2px;min-width:240px}
.cp-t div{display:flex;justify-content:space-between;gap:16px}
.cp-t .last{border-top:1px solid var(--ink);padding-top:4px;font-weight:700}
.cp-n{margin:0;font-size:.8rem;color:var(--muted)}

/* Libros (tablas): el texto nunca se sale de su celda */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table.book{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.book th{background:var(--brand-soft);color:var(--ink);font-size:.74rem;font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:normal;overflow-wrap:break-word;word-break:normal;hyphens:none;line-height:1.25;min-width:4.6em}
.book th.grp{text-align:center;background:var(--brand);color:var(--brand-ink);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;border-right:1px solid rgba(255,255,255,.25)}
.book td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:middle;white-space:normal;overflow-wrap:break-word;word-break:normal;line-height:1.3}
.book td.tx{min-width:9em}
.book td.t-d{min-width:8.6em}.book td.t-doc{min-width:9.8em}.book td.t-n{min-width:7.4em}.book td.t-k,.book td.t-s,.book td.t-i{min-width:5em}.book td.t-c{min-width:6.5em}.book td.t-sel{min-width:15em}
input::placeholder{color:var(--muted);opacity:.6}input:disabled::placeholder{color:transparent}
.book td.num{white-space:nowrap}
.book th.num{text-align:right;font-family:var(--body)}
#abody,#mbody{display:grid;gap:14px;min-width:0}
.co{align-items:start}
.book td{vertical-align:middle}
.book tr:last-child td{border-bottom:0}
.book tfoot td{border-top:1.5px solid var(--ink);border-bottom:0}
.book td.in{padding:3px 4px;min-width:6.2em}
.book td.in input,.book td.in select{padding:6px 8px;border-radius:8px;font-size:15px}
.book td.in select.tsel{width:100%;min-width:8.5em;font-size:14px;padding:6px 4px;text-overflow:ellipsis}
.dwrap{position:relative;display:flex;align-items:center;min-width:0;width:100%}
.dwrap .dtxt{width:100%;min-width:7.6em;padding-right:30px!important}
.dcal{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:4px;display:grid;place-items:center;border-radius:6px;cursor:pointer}
.dcal:hover{color:var(--brand);background:var(--brand-soft)}
.dpick{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.book td.in input.num{text-align:right;font-family:var(--mono)}
.book td.in.ok input,.book td.in.ok select,.book tr.ok td.in input{background:var(--ok-bg);color:var(--ok);-webkit-text-fill-color:var(--ok);border-color:transparent}
.book td.in.bad input,.book td.in.bad select,.book tr.bad td.in input{background:var(--bad-bg);color:var(--bad);-webkit-text-fill-color:var(--bad);border-color:transparent}
.book td.in.mid input{background:var(--warn-bg);color:var(--warn);-webkit-text-fill-color:var(--warn)}
.book .den{color:var(--muted);font-size:.82rem;min-width:10em}
.book.diario{min-width:560px}
.book.diario th:nth-child(3),.book.diario th:nth-child(4){text-align:right}
.den-m{display:none;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:3px;overflow-wrap:anywhere}
.book.compras,.book.ventas{min-width:0}
.book.banco{min-width:0}
.book.kardex{min-width:0}
.book.compras td.in,.book.ventas td.in,.book.kardex td.in,.book.banco td.in{min-width:0}
.book.compras td.in input,.book.ventas td.in input,.book.kardex td.in input,.book.banco td.in input{padding:6px 5px;font-size:14px}
.book.compras,.book.ventas,.book.kardex,.book.banco{font-size:.8rem}
.book.compras th,.book.ventas th,.book.kardex th,.book.banco th{min-width:0;font-size:.68rem;padding:6px 5px}
.book.compras td,.book.ventas td,.book.kardex td,.book.banco td{padding:5px 4px}
.book td.t-d input{min-width:6.6em}.book td.t-doc input{min-width:7.4em}
.book.kardexu{min-width:760px}
.book.caja{min-width:640px}
.book.activo{min-width:980px}
.book td.badc{background:var(--bad-bg);color:var(--bad)}
.book tr.badr td{background:var(--bad-bg)}
.book tr.tb td{font-weight:700}
.book tr.dest td{color:var(--muted)}
.book td.solc{color:var(--ok);font-weight:600}
.book tr.click{cursor:pointer}
.book tr.click:hover td{background:var(--brand-soft)}
.book.pdt td.in{min-width:8em}
.swipe{display:none;margin:-4px 0 0}
.mcards{display:grid;gap:8px}
.mhead{font-weight:700;padding:6px 0 4px;border-bottom:1px solid var(--line)}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.mcard-in{border-color:var(--brand-2);box-shadow:inset 3px 0 0 var(--brand-2)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px dashed var(--rule);min-width:0}
.mrow:last-child{border-bottom:0}
.ml{font-size:.8rem;color:var(--muted);font-weight:600;flex:1 1 45%;min-width:0;overflow-wrap:anywhere}
.mv{flex:1 1 55%;text-align:right;min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.mv .num{font-family:var(--mono)}
.mrow.mf .mv{flex:0 0 58%}
.mv .in{display:block}
.mv input,.mv select{width:100%;padding:8px 10px;font-size:16px;border-radius:9px}
.mv input.num{text-align:right;font-family:var(--mono)}
.mv .in.ok input,.mv .in.ok select{background:var(--ok-bg);color:var(--ok);-webkit-text-fill-color:var(--ok);border-color:transparent}
.mv .in.bad input,.mv .in.bad select{background:var(--bad-bg);color:var(--bad);-webkit-text-fill-color:var(--bad);border-color:transparent}
.mv .solc{color:var(--ok)}
.nv .ls{display:none}
.book td.in input:disabled::placeholder{color:transparent;-webkit-text-fill-color:transparent}
.glosa{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.85rem;color:var(--muted);padding:2px 2px 0}
.addl{justify-self:start}

/* Corrección */
.fb{border-radius:12px;padding:12px 14px}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.badf{background:var(--bad-bg)}
.fbh{margin:0 0 6px;font-weight:700}
.fb.badf .fbh{color:var(--bad)}
.fb ul{margin:0;padding-left:18px;display:grid;gap:6px}
.fb li{font-size:.9rem}
.why{color:var(--muted)}
.solbox{border:1px dashed var(--ok);border-radius:12px;padding:12px}
.whys{margin:8px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted);display:grid;gap:3px}

/* Historial */
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:5px;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select{text-transform:none;letter-spacing:0;font-weight:500}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem;margin:10px 0}
.chk input{width:18px;height:18px;flex:none}
.hist{display:grid;gap:6px}

function hstr(s) {

function makeRuc(R, pre = '20') {
  let b = pre; while (b.length < 10) b += R.int(0, 9);
  const w = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
  const s = [...b].reduce((a, d, i) => a + (+d) * w[i], 0);

  const sups = Array.from({length: 6}, () => ({n: uniq(() => R.pick(W3) + ' ' + R.pick(W2) + ' S.A.C.'), ruc: makeRuc(R)}));

  const pers = Array.from({length: 6}, () => ({n: uniq(() => personName(R)), dni: String(R.int(10000000, 79999999))}));

  prods.forEach(p => { const q = R.int(150, 600); inv[p.id] = {q, t: r2(q * p.cu)}; });
  const caja = R.int(15, 40) * 100, bco = R.int(30, 70) * 1000;

  const cxc = [0, 1].map(() => { const c = R.pick(clis), base = R.amt(800, 4000), igv = r2(base * 0.18); return {doc: 'F001-' + R.int(20, 90), base, igv, total: r2(base + igv), cli: c, prev: true}; });

  const assets = [ACTIVOS[0], ACTIVOS[1]].map(a => ({n: a.n.replace(' para el área administrativa', ''), c: a.c, rate: a.rate, cost: R.int(a.lo / 10, a.hi / 10) * 10, months: R.int(3, 20)}));

    id: M, ts: Date.now(), regime: regime || 'MYPE',

/* Renta de 5ta categoría (sueldo igual todo el año): proyección anual = 12 sueldos + 2 gratificaciones + bonificación 9%; menos 7 UIT; escala progresiva; retención mensual = impuesto ÷ 12 */
function quinta(rem) {
  const proy = r2(rem * 12 + rem * 2 + rem * 2 * 0.09), neta = Math.max(0, r2(proy - 7 * UIT));
  const tr = [[5, 0.08], [20, 0.14], [35, 0.17], [45, 0.20], [Infinity, 0.30]]; let rest = neta, lo = 0, imp = 0;
  for (const [hi, t] of tr) { const top = hi * UIT, tramo = Math.max(0, Math.min(rest, top - lo)); imp += tramo * t; rest -= tramo; lo = top; if (rest <= 0) break; }
  imp = r2(imp); return {proy, neta, imp, mens: r2(imp / 12)};
}

};
const CYCLE_PLAN = CYCLE_PLANS[1];
const LEVEL_TXT = {1: 'Nivel 1 · básico', 2: 'Nivel 2 · con percepciones, detracciones, retenciones, préstamo y renta de 5ta', 3: 'Nivel 3 · completo: además activos fijos y aportes de capital'};
const FALLBACK_OPS = ['compra_serv', 'compra_merc', 'gasto_caja', 'aporte', 'rxh'];

function genCycleOps(R, mo) {
  const M = mo.id, L = lastDay(M), ops = [], PLAN = CYCLE_PLANS[Math.min(3, mo.level || 1)];
  PLAN.forEach((item, i) => {
    const day = Math.min(L, Math.round(1 + i * (L - 2) / (PLAN.length - 1)));
    const date = `${M}-${p2(day)}`;
    const [type, f] = item.split(':');
    let op = null;
    for (let t = 0; t < 30 && !op; t++) { const snap = JSON.stringify(mo.state); op = genOp(R, mo, type, date, f || 'diario'); if (!op) mo.state = JSON.parse(snap); }
    for (let k = 0; !op && k < FALLBACK_OPS.length * 3; k++) { const snap = JSON.stringify(mo.state); op = genOp(R, mo, FALLBACK_OPS[k % FALLBACK_OPS.length], date, 'diario'); if (!op) mo.state = JSON.parse(snap); }
    if (op) ops.push(op);
  });
  return ops;
}
function accLinesAll(mo, ops, withDest = true) {
  const L = mo.open.map(([c, d, h]) => ({c, d, h, f: mo.id + '-01', g: 'Asiento de apertura'}));
  ops.forEach(op => op.lines.forEach(l => { if (withDest || !l.dest) L.push({c: l.c, d: l.d, h: l.h, f: op.date, g: op.glosa}); }));
  return L;
}
function cycleAgg(mo, ops) {
  const acc = {};
  accLinesAll(mo, ops).forEach(l => { const k = k2(l.c); const o = acc[k] || (acc[k] = {d: 0, h: 0}); o.d = r2(o.d + l.d); o.h = r2(o.h + l.h); });
  return acc;
}
const N1 = (v, why, l, k = 'calculo', o = {}) => F('n', v, why, {l, k, tol: 1, ...o});
const N2 = (v, why, l, k = 'calculo', o = {}) => F('n', v, why, {l, k, tol: 0.02, ...o});

function stageCasesFromOps(mo, ops) {
  const out = [];
  const push = c => { if (c) { c.stage = stgOf(c.fmt); out.push(c); } };
  const isV = op => ['venta_merc', 'nota_credito'].includes(op.type);
  // correlativos de cada registro en el orden del mes
  const COR = {compras: new Map(), ventas: new Map(), caja: new Map(), banco: new Map()};
  ops.forEach(op => { if (op.reg) { const m = isV(op) ? COR.ventas : COR.compras; m.set(op, m.size + 1); } if (op.cash && op.cash.caja) COR.caja.set(op, COR.caja.size + 1); if (op.cash && op.cash.banco) COR.banco.set(op, COR.banco.size + 1); });
  const dts = {}; ops.forEach(op => { if (op.dt) dts[op.dt.doc] = op.dt; });
  const refOf = op => {
    const L = [];
    if (op.reg) L.push([isV(op) ? '140100' : '080100', (isV(op) ? COR.ventas : COR.compras).get(op), op.reg.serie + '-' + op.reg.num]);
    if (op.cash && op.cash.caja) L.push(['010100', COR.caja.get(op), op.cash.caja.nop || (op.cash.banco && op.cash.banco.nop) || (op.cp ? op.cp.serie + '-' + op.cp.num : '')]);
    if (op.cash && op.cash.banco) L.push(['010200', COR.banco.get(op), op.cash.banco.nop || '']);
    if (!L.length || !L[0][2]) return null;
    return {lib: L[0][0], alts: L.slice(1).map(x => x[0]), cor: L[0][1], cors: L.slice(1).map(x => x[1]), doc: String(L[0][2])};
  };
  ops.forEach((op, i) => push(caseFromOp(op, 'diario', mo.co, {asiento: i + 2, ref: refOf(op)})));
  ops.forEach(op => { if (op.reg && !isV(op)) push(caseFromOp(op, 'compras', mo.co, {cor: COR.compras.get(op), dt: dts[op.reg.serie + '-' + op.reg.num]})); });
  ops.forEach(op => { if (op.reg && isV(op)) push(caseFromOp(op, 'ventas', mo.co, {cor: COR.ventas.get(op)})); });
  ops.forEach(op => { if (op.cash && op.cash.caja) push(caseFromOp(op, 'caja', mo.co, {cor: COR.caja.get(op)})); });
  ops.forEach(op => { if (op.cash && op.cash.banco) push(caseFromOp(op, 'banco', mo.co, {cor: COR.banco.get(op)})); });
  ops.forEach(op => { if (op.kx) push(caseFromOp(op, 'kardex', mo.co)); });
  ops.forEach(op => { if (op.pla) planillaCases(mo, op).forEach(push); });
  ops.forEach(op => { if (op.bs) push(bsCase(mo, op)); });
  return out;
}

  ['1041', '101', '1212', '4212', '2011', '40111', '7012'].forEach(code => { const m = mayorCase(mo, ops, code); if (m) { m.stage = stgOf('mayor'); cases.push(m); } });

  cases.forEach((c, i) => { c.n = i + 1; c.fp = fpHash(c.fp + '|' + seed); });
  // la empresa del ciclo: datos fijos + saldos de apertura (para "Mi empresa")
  mo.state.log = [];

}

async function startSession(user) {

  Store.useUser(user.uid);
  $('#view').innerHTML = `<div class="loading">${LOGO(56)}<p>Cargando tu progreso…</p></div>`;
  const [blk, adm, aviso, acc, exs] = await Promise.all([Store.get('blocked/' + user.uid).catch(() => null), A.user.email ? Store.get('admins/' + A.user.email).catch(() => null) : null, Store.get('config/aviso').catch(() => null), Store.get('config/acceso').catch(() => null), Store.get('config/examenes').catch(() => null)]);
  A.acc = acc || {}; A.exams = (exs && exs.list) || [];
  if (blk) { $('#view').innerHTML = `<section class="card ob">${LOGO(56)}<h2>Cuenta bloqueada</h2><p>El administrador bloqueó esta cuenta. Si crees que es un error, comunícate con él.</p><button class="ghost" data-act="logout">Cerrar sesión</button></section>`; return; }

  await afterProfile();
}

/* ===================== Empresas (ciclos) ===================== */
function newIndex(b) {
  return {id: b.id, kind: b.kind, ts: b.ts, month: b.month, date: b.date, hour: b.hour || '', n: b.cases.length, cycleNo: b.cycleNo || 0,
    emp: b.emp, summ: b.cases.map(c => ({f: c.fmt, o: c.op, t: c.title, d: c.date, st: b.kind === 'ciclo' ? stgOf(c.fmt) : (c.stage || 0), g: c.glosa || '', doc: c.cp ? (c.cp.serie + '-' + c.cp.num) : '', rs: c.reg ? c.reg.rs : ''})), ans: {}, done: 0, okc: 0};
}
function empOf(mo) { return {id: mo.id, regime: mo.regime, co: mo.co, open: mo.open, c621: null, level: mo.level || 1}; }
function activeCycle() { return A.idx.filter(x => x.kind === 'ciclo').sort((a, b) => b.ts - a.ts).find(x => !x.fin) || null; }
async function ensureCycle(force) {
  if (A.busy) return; A.busy = true;
  try {
    if (activeCycle() && !force) return;
    const n = (A.P.cycleN || 0) + 1, id = 'C' + String(n).padStart(4, '0');
    if (await Store.get(PATH.i(id))) { A.P.cycleN = n; await saveProfile(); await loadIdx(); return; }
    const M = limaISO().slice(0, 7);
    const {mo, cases} = newCycleData(A.user.uid + '|' + n, A.P.regime || 'MYPE', M, n);
    const b = {id, kind: 'ciclo', ts: Date.now(), month: M, date: limaISO(), cycleNo: n, emp: empOf(mo), cases};
    await Store.set(PATH.b(id), b);
    const li = newIndex(b);
    await Store.set(PATH.i(id), li);
    A.lotes[id] = b; A.idx.unshift(li);
    A.P.cycleN = n; await saveProfile();
  } finally { A.busy = false; }
}
// empresas creadas con el esquema de 7 etapas: cada caso se reubica en su etapa nueva según su libro
function restageIdx(li) { if (li && li.kind === 'ciclo' && li.summ) li.summ.forEach(x => { x.st = stgOf(x.f); }); return li; }
function restageLote(b) { if (b && b.kind === 'ciclo' && b.cases) b.cases.forEach(c => { c.stage = stgOf(c.fmt); }); return b; }
async function loadIdx(n = A.histN) { A.idx = (await Store.list(PATH.colI(), {limit: n})).map(restageIdx); }
async function getLote(id) { if (!A.lotes[id]) A.lotes[id] = restageLote(await Store.get(PATH.b(id))); return A.lotes[id]; }
async function getIndex(id) { let li = A.idx.find(x => x.id === id); if (!li) { li = restageIdx(await Store.get(PATH.i(id))); if (li) A.idx.push(li); } return li; }
function stageOf(li, n) { return (li.summ[n - 1] || {}).st || 0; }
function stageInfo(li) {
  const per = {}; li.summ.forEach((s, i) => { const st = s.st || 0; const o = per[st] || (per[st] = {n: 0, done: 0, ok: 0}); o.n++; const a = li.ans[i + 1]; if (a && !a.draft) { o.done++; if (a.ok) o.ok++; } });
  let cur = NST; for (let s = 1; s <= NST; s++) if (per[s] && per[s].done < per[s].n) { cur = s; break; }
  return {per, cur};
}
/* Ranking: resumen público de cada estudiante */
let rankT = null;
function pushRank() {
  clearTimeout(rankT);
  rankT = setTimeout(async () => {
    if (!A.user) return;
    const ans = allAnswers(), ok = ans.filter(x => x.a.ok).length;
    const cyc = activeCycle(), si = cyc ? stageInfo(cyc) : null;
    const r = {name: A.user.name, photo: A.user.photo, group: A.P.group || '', casos: ans.length, ok, pct: ans.length ? Math.round(ok / ans.length * 100) : 0,
      empresas: A.idx.filter(x => x.kind === 'ciclo' && x.fin).length, etapa: si ? si.cur : 0, racha: streak().n, ts: Date.now(), ex: {}};
    A.idx.filter(x => x.kind === 'examen' && x.exam && x.exam.gid && x.exam.fin).forEach(x => { r.ex[x.exam.gid] = {nota: Math.round(x.okc / x.n * 20), ok: x.okc, n: x.n, at: x.exam.done || x.ts}; });
    try { await Store.set('rank/' + A.user.uid, r, true); } catch (e) { console.warn(e); }
  }, 1500);
}

/* ===================== Estadísticas ===================== */
function allAnswers(idx = A.idx) { const out = []; idx.forEach(li => Object.entries(li.ans || {}).forEach(([n, a]) => { if (a && a.at && !a.draft) out.push({li, n: +n, a, s: li.summ[+n - 1] || {}}); })); return out; }
function streak(idx) {
  const days = new Set(allAnswers(idx).map(x => limaISO(x.a.at)));
  let d = new Date(Date.now() - OFF), n = 0;
  const iso = x => `${x.getUTCFullYear()}-${p2(x.getUTCMonth() + 1)}-${p2(x.getUTCDate())}`;
  if (!days.has(iso(d))) d = new Date(d.getTime() - 864e5);
  while (days.has(iso(d))) { n++; d = new Date(d.getTime() - 864e5); }
  return {n, today: days.has(limaISO())};
}

/* ===================== Repaso y examen ===================== */
async function makeExtra(kind) {
  const M = limaISO().slice(0, 7), ts0 = Date.now();
  const mo = newMonth(M, A.P.regime || 'MYPE', '|x' + A.user.uid + ts0);
  let plan;
  if (kind === 'repaso') {
    const fails = allAnswers().filter(x => !x.a.ok).sort((a, b) => b.a.at - a.a.at).slice(0, 40);
    if (!fails.length) { toast('Todavía no tienes errores para repasar. ¡Bien!'); return; }
    const R = rngFrom('rp' + Date.now());
    plan = Array.from({length: 10}, () => { const x = R.pick(fails); if (/^(planilla|plares)$/.test(x.s.f)) return 'diario:planilla'; return x.s.o && x.s.o !== 'synth' ? x.s.f + ':' + x.s.o : x.s.f; });
  } else {
    const ex = A.idx.find(x => x.kind === 'examen' && x.exam && !x.exam.fin);
    if (ex) return openLote(ex.id);
    const R = rngFrom('ex' + Date.now());
    const LV = [0, 1, 2, 2, 3, 3, 4, 4, 5, 6, 7], maxSt = A.idx.some(x => x.kind === 'ciclo' && x.fin) ? 7 : (activeCycle() ? LV[stageInfo(activeCycle()).cur] : 1);
    const fm = LEVELS.slice(0, maxSt).flatMap(l => l.f);
    plan = Array.from({length: 20}, () => R.pick(fm));
  }
  const ts = Date.now(), id = (kind === 'repaso' ? 'R' : 'X') + ts;
  const cases = genCases(kind + ':' + ts, mo, plan, limaISO(), false);
  const b = {id, kind, ts, month: M, date: limaISO(), hour: new Date(ts - OFF).toISOString().slice(11, 16), emp: empOf(mo), cases};
  const li = newIndex(b);
  if (kind === 'examen') li.exam = {t0: ts, end: ts + 30 * 60e3, fin: false};
  await Store.set(PATH.b(id), b); await Store.set(PATH.i(id), li);
  A.lotes[id] = b; A.idx.unshift(li);
  openLote(id);
}

async function restoreBackup(file) {

    if (!o || o.app !== 'viernes' || !o.data) throw new Error('formato');

    if (A._restAsk !== file.name + file.size) { A._restAsk = file.name + file.size; toast(`La copia tiene ${n} registros y reemplazará tu progreso actual. Elige el archivo otra vez para confirmar.`, 6000); $('#sImp').value = ''; return; }

function nextCell(inp, back) {

  const col = [...tr.children].indexOf(td);
  const rows = [...tr.parentElement.children];
  const ri = rows.indexOf(tr);
  for (let r = ri + (back ? -1 : 1); r >= 0 && r < rows.length; r += back ? -1 : 1) {
    const cell = rows[r].children[col]; const x = cell && cell.querySelector('input:not([disabled]):not(.dpick),select:not([disabled])');
    if (x) { x.focus(); x.select && x.select(); return; }
  }

function stackify(root = document) {
  root.querySelectorAll('table.book:not(.nostack):not([data-stk])').forEach(t => {
    t.dataset.stk = '1'; t.classList.add('stackm');
    const hr = [...t.querySelectorAll('thead tr')];
    const last = hr[hr.length - 1]; if (!last) return;
    // encabezados alineados igual que su columna (números a la derecha)
    const cnt = {}, tot = {};
    t.querySelectorAll('tbody tr').forEach(tr => { let ci = 0; [...tr.children].forEach(td => { if ((td.colSpan || 1) === 1 && (td.textContent.trim() || td.querySelector('input,select'))) { tot[ci] = (tot[ci] || 0) + 1; if (td.classList.contains('num') || td.querySelector('input.num')) cnt[ci] = (cnt[ci] || 0) + 1; } ci += td.colSpan || 1; }); });
    { let ci = 0; [...last.children].forEach(th => { if ((th.colSpan || 1) === 1 && tot[ci] && (cnt[ci] || 0) / tot[ci] >= 0.5) th.classList.add('num'); ci += th.colSpan || 1; }); }
    const labels = [];
    [...last.children].forEach(th => { for (let i = 0; i < (th.colSpan || 1); i++) labels.push(th.textContent.trim()); });
    if (hr.length > 1) { let ci = 0; [...hr[0].children].forEach(th => { const g = th.textContent.trim(); for (let i = 0; i < (th.colSpan || 1); i++, ci++) if (g && labels[ci] !== undefined && g !== labels[ci]) labels[ci] = g + ' · ' + labels[ci]; }); }
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => {
      let ci = 0; const ant = /^\s*Saldo anterior/.test(tr.textContent);
      [...tr.children].forEach(td => {
        if (!td.dataset.l) td.dataset.l = (labels[ci] || '').replace(ant ? /^Saldo final/ : /^$/, 'Saldo anterior');
        const empty = !td.querySelector('input,select,button,img') && !td.textContent.trim();
        td.classList.toggle('e', empty);
        ci += td.colSpan || 1;
      });
    });
  });
}
function fitTables() {
  const mob = matchMedia('(max-width:640px)').matches;
  document.querySelectorAll('table.book.stackm').forEach(t => {
    if (mob) { t.classList.remove('fitcards'); return; }
    if (!t.offsetParent) return;
    t.classList.remove('fitcards');
    if (t.classList.contains('sunat')) return;
    const w = t.closest('.tw') || t.parentElement;

    if (!bad) bad = [...t.querySelectorAll('input:not(.dpick)')].some(i => i.offsetParent && i.clientWidth < 72 && !i.classList.contains('ok') && i.type !== 'checkbox');
    if (!bad) bad = [...t.querySelectorAll('input:not(.dpick)')].some(i => i.value && i.scrollWidth > i.clientWidth + 2);

}

    <h3 class="sec">Empresas</h3><div class="tw"><table class="book resp"><thead><tr><th>Nº</th><th>Empresa</th><th>Período</th><th>Avance</th><th>Correctos</th><th>Nota</th></tr></thead><tbody>${cyc.map(c => `<tr><td class="num" data-l="Nº">${c.cycleNo}</td><td class="tx lead" data-l="Empresa">${esc(c.emp.co.name)}</td><td data-l="Período">${mesLbl(c.emp.id)}</td><td data-l="Avance">${c.fin ? 'Terminada' : 'Etapa ' + stageInfo(c).cur + ' de ' + NST} · ${c.done}/${c.n}</td><td class="num" data-l="Correctos">${c.okc}</td><td class="num" data-l="Nota">${c.done ? Math.round(c.okc / c.done * 20) : 0}/20</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin empresas.</td></tr>'}</tbody></table></div>
    <h3 class="sec">Acierto por libro</h3>${Object.entries(byF).map(([f, o]) => { const p = Math.round(o.ok / o.n * 100); return `<div class="srow"><div class="sl"><span>${esc(LIBRO[f] || f)}</span><span class="num">${p}% · ${o.ok}/${o.n}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join('') || '<p class="empty">Sin casos resueltos.</p>'}
    <div class="actions"><button class="ghost" data-act="${bl ? 'admunblock' : 'admblock'}" data-id="${uid}">${bl ? 'Desbloquear' : 'Bloquear acceso'}</button><span class="sp"></span><button class="btn warn" data-act="admwipe" data-id="${uid}">Eliminar sus datos</button></div>`;
  } catch (e) { $('#aud').innerHTML = `<p class="empty">No se pudo cargar: ${esc(e.message || e)}</p>`; }
}
async function adminAct(act, t) {
  try {
    if (act === 'admgroupadd') {
      const name = $('#agName').value.trim(); if (!name) return toast('Escribe el nombre del grupo');
      let code; for (let i = 0; i < 10; i++) { code = 'VIE-' + String(Math.floor(1000 + Math.random() * 9000)); if (!(await Store.get('groups/' + code))) break; }
      await Store.set('groups/' + code, {name, ts: Date.now(), by: A.user.email}, true); toast('Grupo creado: ' + code); return renderAdmin();
    }
    if (act === 'admgroupdel') { if (!confirmTwice('g' + t.dataset.id, '¿Eliminar el grupo ' + t.dataset.id + '? Toca otra vez para confirmar.')) return; await Store.del('groups/' + t.dataset.id); toast('Grupo eliminado'); return renderAdmin(); }
    if (act === 'admacceso') { await Store.set('config/acceso', {req: $('#accReq').checked, ts: Date.now()}, true); return toast($('#accReq').checked ? 'Ahora se pide código de grupo para entrar' : 'Acceso libre con cuenta de Google'); }
    if (act === 'admxls') return notasXLS($('#xgGr').value);
    if (act === 'admexxls') { const ex = await Store.get('config/examenes'); const e = ((ex && ex.list) || []).find(x => x.id === t.dataset.id); return notasXLS(e ? e.group : '', e); }
    if (act === 'admexadd') {
      const title = $('#exT').value.trim(), start = new Date($('#exS').value + ':00Z').getTime() + OFF, end = new Date($('#exE').value + ':00Z').getTime() + OFF;
      const fm = $$('.exF').filter(x => x.checked).flatMap(x => LEVELS[+x.value].f);
      if (!title) return toast('Escribe el título del examen'); if (!(end > start)) return toast('La hora de cierre debe ser después del inicio'); if (!fm.length) return toast('Elige al menos un libro');
      const ex = (await Store.get('config/examenes')) || {list: []};
      ex.list = (ex.list || []).filter(e => e.end > Date.now() - 120 * 864e5);
      ex.list.push({id: 'E' + Date.now().toString(36).toUpperCase(), title, group: $('#exG').value, start, end, n: +$('#exN').value, mins: +$('#exM').value, f: fm, by: A.user.email, ts: Date.now()});
      ex.ts = Date.now(); await Store.set('config/examenes', ex); toast('Examen programado'); return renderAdmin();
    }
    if (act === 'admexdel') { if (!confirmTwice('e' + t.dataset.id, '¿Eliminar este examen? Toca otra vez para confirmar.')) return; const ex = (await Store.get('config/examenes')) || {list: []}; ex.list = (ex.list || []).filter(e => e.id !== t.dataset.id); ex.ts = Date.now(); await Store.set('config/examenes', ex); toast('Examen eliminado'); return renderAdmin(); }
    if (act === 'admaviso') { await Store.set('config/aviso', {text: $('#avTx').value.trim(), on: $('#avOn').checked, ts: Date.now()}, true); A.aviso = $('#avOn').checked && $('#avTx').value.trim() ? {text: $('#avTx').value.trim(), on: true} : null; return toast('Aviso guardado'); }
    if (act === 'admadminadd') { const em = $('#adEm').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('Escribe un correo válido'); await Store.set('admins/' + em, {ts: Date.now(), by: A.user.email}, true); toast('Administrador agregado'); return renderAdmin(); }
    if (act === 'admadmindel') { await Store.del('admins/' + t.dataset.id); toast('Administrador quitado'); return renderAdmin(); }
    if (act === 'admblock') { await Store.set('blocked/' + t.dataset.id, {ts: Date.now(), by: A.user.email}, true); toast('Usuario bloqueado'); closeModal(); return renderAdmin(); }
    if (act === 'admunblock') { await Store.del('blocked/' + t.dataset.id); toast('Usuario desbloqueado'); closeModal(); return renderAdmin(); }
    if (act === 'admwipe') {
      const uid = t.dataset.id; if (!confirmTwice('w' + uid, 'Se borrará todo su progreso. Toca otra vez para confirmar.')) return;
      const idx = await Store.list('users/' + uid + '/i', {limit: 1000});
      for (const li of idx) { await Store.del('users/' + uid + '/i/' + li.id).catch(() => {}); await Store.del('users/' + uid + '/b/' + li.id).catch(() => {}); }
      await Store.del('users/' + uid).catch(() => {}); await Store.del('rank/' + uid).catch(() => {});
      toast('Datos eliminados'); closeModal(); return renderAdmin();
    }
  } catch (e) { console.error(e); toast('No se pudo completar: ' + (e.message || e)); }
}
/* Excel de notas para el administrador */
async function notasXLS(group, exam) {
  toast('Preparando Excel…');
  try { await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); } catch (e) { toast('No se pudo cargar el generador de Excel'); return; }
  const [rk, exd] = await Promise.all([Store.listPlain('rank', 1000), Store.get('config/examenes').catch(() => null)]);
  const L = rk.filter(r => !group || r.group === group).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'es'));
  const exs = exam ? [exam] : ((exd && exd.list) || []).filter(e => !group || !e.group || e.group === group).sort((a, b) => a.start - b.start);
  const head = ['Nº', 'Estudiante', 'Grupo', 'Casos resueltos', 'Correctos', '% acierto', 'Nota (0-20)', 'Empresas terminadas', 'Etapa actual', 'Última actividad', ...exs.map(e => e.title + ' (nota)')];
  const rows = [head, ...L.map((r, i) => [i + 1, r.name || 'Estudiante', r.group || '', r.casos || 0, r.ok || 0, (r.pct || 0) / 100, Math.round((r.pct || 0) / 5), r.empresas || 0, r.etapa ? r.etapa + ' · ' + STAGES[Math.min(r.etapa, NST) - 1].t : '', r.ts ? fmtD(limaISO(r.ts)) : '', ...exs.map(e => r.ex && r.ex[e.id] ? r.ex[e.id].nota : null)])];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = head.map((h, ci) => ({wch: Math.min(40, Math.max(8, ...rows.map(r => String(r[ci] ?? '').length + 2)))}));
  for (let R = 1; R < rows.length; R++) { const c = ws[XLSX.utils.encode_cell({r: R, c: 5})]; if (c) c.z = '0%'; }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Notas');
  const out = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
  await saveFile(`Viernes-notas-${exam ? exam.title.replace(/[^A-Za-z0-9]+/g, '-') : group || 'todos'}-${limaISO()}.xlsx`, new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function confirmTwice(key, msg) { if (A._cf === key && Date.now() - A._cfT < 5000) { A._cf = null; return true; } A._cf = key; A._cfT = Date.now(); toast(msg, 5000); return false; }
document.addEventListener('click', e => { const b = e.target.closest('[data-act=rktab]'); if (b) { A.rkTab = b.dataset.k; renderRanking(); } });

if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => { r.update(); setInterval(() => r.update(), 30 * 60 * 1000); }).catch(() => {}); let rl = !navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', () => { if (rl) return; rl = true; location.reload(); }); }); }
</script>
